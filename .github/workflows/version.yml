name: Version

on:
  push:
    branches: [ main ]

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create alpha-v1 tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag "alpha-v1" || echo "Tag already exists"