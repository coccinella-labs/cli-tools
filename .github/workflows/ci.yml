name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y cmake libcurl4-openssl-dev nlohmann-json3-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake curl nlohmann-json

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install cmake
        # curl and nlohmann/json will be fetched by CMake

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build .