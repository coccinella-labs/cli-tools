name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake libcurl4-openssl-dev nlohmann-json3-dev

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make

    - name: Run E2E test
      run: |
        cd build
        echo "CEREBRAS_API_KEY=dummy" > .env
        echo "test input" | timeout 10s ./clie || true